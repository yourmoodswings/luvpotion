services:
  - type: web
    name: luvpotion-platform
    branch: codex/admin-backend
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build:admin
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data/luvpotion
      - key: APP_ORIGIN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LIVE_AUCTIONS_ENABLED
        value: "false"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
    disk:
      name: luvpotion-data
      mountPath: /var/data
      sizeGB: 1
